get_unlock_records:
  name: 查询开锁记录
  description: 从云端拉取指定设备的开锁记录。
  fields:
    sn:
      name: 设备 SN
      description: 要查询的设备序列号
      required: true
      example: "10000748294389457514"
      selector:
        text:
    hours:
      name: 回溯小时数
      description: 查询最近多少小时内的记录
      default: 24
      selector:
        number:
          min: 1
          max: 720
          unit_of_measurement: 小时
